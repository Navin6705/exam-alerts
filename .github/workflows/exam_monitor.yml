name: EduAlert Automated Exam Scraper

on:
  schedule:
    # Run automatically every 30 minutes (24/7 in GitHub cloud)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Exam News Scraper & Dispatcher
        env:
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_RECIPIENT_PHONE: ${{ secrets.META_RECIPIENT_PHONE }}
        run: |
          python bot_service.py --once

      - name: Commit & Push Updated Database State
        run: |
          git config --global user.name "EduAlert-Bot"
          git config --global user.email "edualert-bot@github.actions"
          git add data/news_alerts.db
          # Only commit if database has new entries
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Auto-update: Record latest exam notices [skip ci]"
            git push
          fi
